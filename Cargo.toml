[package]
name = "sexual_tiger"
version = "0.1.0"
edition = "2021"
default-run = "sexual_tiger"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.29"
data-encoding = "2.4.0"
dotenvy = "0.15"
rand = "0.8.5"
reqwest = { version = "0.12", features = ["json"] }
ring = "0.16.20"
rng = "0.1.0"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.91"
serenity = { version = "0.12.5", features = ["model", "collector", "client", "standard_framework", "voice"] }
sha256 = "1.4.0"
songbird = { version = "0.6.1", features = ["builtin-queue"] }
symphonia = { version = "0.5", features = ["all"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
sqlx-sqlite = { version = "0.8.6", features = ["chrono"] }
httparse = "1.10"
tokio = { version = "1.23.0", features = ["rt-multi-thread", "net", "io-util", "macros"] }
youtube_dl = { version = "0.8.0", features = ["downloader"] }
